# Render Blueprint — deploys the full PL Analytics stack.
# In Render: New + → Blueprint → select this repository → Apply.
# This file must stay at the repository ROOT for Render to detect it.
services:
  # ── Search ────────────────────────────────────────────────
  - type: web
    name: pl-meilisearch
    runtime: image
    image:
      url: docker.io/getmeili/meilisearch:v1.8
    plan: starter          # free plan does not support disks; search index would be lost on redeploy
    disk:
      name: meili-data
      mountPath: /meili_data
      sizeGB: 1
    envVars:
      - key: MEILI_MASTER_KEY
        generateValue: true
      - key: MEILI_ENV
        value: production
      - key: MEILI_NO_ANALYTICS
        value: "true"

  # ── API backend (Express + Prisma) ───────────────────────
  - type: web
    name: pl-backend
    runtime: docker
    rootDir: data/pl-analytics-main
    dockerfilePath: infra/docker/Dockerfile.backend
    plan: starter
    healthCheckPath: /health
    preDeployCommand: "cd backend && npx prisma db push --skip-generate && npx prisma db seed || true"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pl-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pl-redis
          type: keyvalue
          property: connectionString
      - key: MEILISEARCH_HOST
        value: http://pl-meilisearch:7700
      - key: MEILISEARCH_API_KEY
        fromService:
          name: pl-meilisearch
          type: web
          envVarKey: MEILI_MASTER_KEY
      - key: FRONTEND_URL
        fromService:
          name: pl-frontend
          type: web
          property: host
      - key: STRIPE_SECRET_KEY
        sync: false        # set in the Render dashboard (or leave empty — billing routes only)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"

  # ── Frontend (Next.js standalone) ────────────────────────
  - type: web
    name: pl-frontend
    runtime: docker
    rootDir: data/pl-analytics-main
    dockerfilePath: infra/docker/Dockerfile.frontend
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: pl-backend
          type: web
          property: host
      - key: NODE_ENV
        value: production

  # ── Cache / rate limits ──────────────────────────────────
  - type: keyvalue
    name: pl-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []        # internal only

# ── Database ───────────────────────────────────────────────
databases:
  - name: pl-postgres
    databaseName: pl_analytics
    user: pl_admin
    plan: free             # NOTE: Render free Postgres expires after 30 days — upgrade for production
